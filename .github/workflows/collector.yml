name: Deal Scout permitted-source collector
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deal-scout-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run configured authorized feed collector
        run: python collector.py
      - name: Commit updated public non-sensitive listing data
        run: |
          git config user.name "deal-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/runs.json data/collection.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Deal Scout collection snapshot"
            git push
          fi
