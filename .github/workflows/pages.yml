name: Publish Deal Scout dashboard
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: node --check assets/app.js
      - name: Test listings, filters, source status, and price rules
        run: node tests/dashboard-smoke.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
